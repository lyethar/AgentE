# AgentE — Enumeration Orchestrator Configuration
# ─────────────────────────────────────────────────
# Per-tool `timeout` is in seconds. Set it to 0 (or remove it) for NO timeout —
# the tool then runs to completion before the next stage starts. Long-running
# tools (bbot, cloud_enum, …) should use 0 so they are never killed mid-scan.
# The orchestrator logs which tools are still running every `progress_interval`.

# Stage 1: Subdomain Enumeration
subdomains:
  subfinder:
    timeout: 300
    extra_args: []
    # extra_args: ["-sources", "crtsh,hackertarget,virustotal", "-rate-limit", "150"]

  subscraper:
    timeout: 300
    extra_args: []

  bbot:
    timeout: 0            # no timeout — bbot runs many modules and can take a long time
    extra_args: []
    # extra_args: ["-m", "crtsh", "dnsx", "hackertarget", "columbus"]

# Stage 2: Validation
validation:
  dnsgen:
    timeout: 120
    wordlist: ""          # path to custom wordlist, or empty to skip -w flag
    extra_args: []

  puredns:
    timeout: 600
    rate_limit: 3000      # DNS queries per second
    resolvers: ""         # path to resolvers.txt, or empty to use built-in
    extra_args: []
    # resolvers: "/opt/wordlists/resolvers.txt"

  httpx:
    timeout: 600
    threads: 50
    probe_timeout: 10     # seconds per HTTP request
    extra_args: []
    # extra_args: ["-screenshot", "-screenshot-timeout", "10"]

# Stage 3: Screenshots & Vulnerability Scanning (gowitness + nuclei)
# Runs against the live URLs from Stage 2. Both scans use timeout 0 (no limit)
# so they are never killed before finishing.
recon:
  gowitness:
    timeout: 0             # no timeout — screenshotting many hosts can run long
    report_server: true    # after scanning, launch `gowitness report server` (detached, never killed)
    report_host: "0.0.0.0" # --host for the report server
    report_port: 0         # 0 = gowitness default (7171); set to override with --port
    extra_args: []

  nuclei:
    timeout: 0             # no timeout — template scans can run long
    extra_args: []
    # extra_args: ["-severity", "critical,high,medium", "-rate-limit", "150"]

# Stage 4: Crawl — JS & Endpoint Enumeration (gospider, katana, waymore)
js_enum:
  gospider:
    timeout: 600
    threads: 10
    depth: 3
    concurrent: 5
    timeout_per_req: 15
    extra_args: []

  katana:
    timeout: 600
    depth: 3
    concurrency: 10
    timeout_per_req: 15
    extra_args: []
    # extra_args: ["-headless", "-xhr", "-form"]

  waymore:
    enabled: true
    mode: "U"              # -mode: U = URLs only
    timeout: 0             # no timeout — archive APIs can be slow; never killed early
    extra_args: []
    # extra_args: ["-f"]   # e.g. filter results

# Stage 5: Asset Collection & JavaScript Download
collect:
  workers: 10             # concurrent download threads
  timeout: 30            # per-file HTTP timeout (seconds)
  # user_agent: "Mozilla/5.0 ..."   # override the download User-Agent
  prettier:
    enabled: true         # format downloaded JS with Prettier (npx/global prettier)
                          # no time limit — large/minified bundles run to completion

# Stage 6: Client-Side JavaScript Analysis
# (i) semgrep + DOM heuristics   (ii) secrets & JS-intel scanning
js_analysis:
  enabled: true
  timeout: 0              # per-directory semgrep timeout (0 = no limit)
  dom_scan: true          # regex DOM source/sink/postMessage/listener heuristics
  # configs:              # override the semgrep rule packs (default: a broad set)
  #   - p/owasp-top-ten
  #   - p/secrets
  #   - p/xss

# Stage 6 (i): Secrets & JS-intel scanning of the downloaded assets
secrets:
  enabled: true
  manual_scan:
    enabled: true
    max_file_mb: 5         # skip files larger than this (per-file, MB)
  trufflehog:
    enabled: true
    timeout: 0             # no timeout — never killed before finishing
    verify: false          # true = let trufflehog verify creds against live services
                           # (active/intrusive); default off (--no-verification)
    extra_args: []
    # extra_args: ["--only-verified"]

# Stage 7: Cloud Infrastructure
cloud:
  cloud_enum:
    timeout: 0            # no timeout — cloud_enum brute-forces many providers
    extra_args: []
    # extra_args: ["-l", "/opt/wordlists/cloud_enum_mutations.txt"]

  pycroburst:
    timeout: 0            # no timeout — Azure brute-force can run long
    mutations: 200
    wordlist: ""          # path to custom wordlist
    extra_args: []

# Stage 8: Email & Username Enumeration
email:
  intelx:
    # IntelX / phonebook.cz phonebook API (https://free.intelx.io).
    # The API key is read from the INTELX_KEY environment variable — never hardcode it here.
    maxresults: 10000
    timeout: 20          # server-side search timeout (seconds)

  linkedin2username:
    # Runs interactively (its output is visible and it prompts for a browser
    # login) and NEVER times out — it is only stopped once it completes.
    # -c (company) and -n (domain) are supplied automatically from the CLI.
    # When there is no interactive terminal (e.g. `docker compose run` without
    # -it, or CI) this stage is skipped so the pipeline never hangs on the login
    # prompt. Set force: true to attempt it anyway (only useful with a TTY).
    force: false
    sleep: 30            # -s: seconds to sleep between LinkedIn page requests
    extra_args: []
    # extra_args: ["-d", "2"]   # e.g. crawl depth

# Stage 9: Exposure & Secrets Discovery (LeakIX, Gitminer3, Google dorks)
exposure:
  leakix:
    # Queried programmatically via the LeakIX JSON API.
    # API key: set here, or via the LEAKIX_API_KEY environment variable.
    api_key: ""
    timeout: 60           # HTTP timeout (seconds)
    max_pages: 3          # pages to fetch (~20 events/page; ~1 req/s rate limit)

  gitminer:
    enabled: true
    github_token: ""      # GitHub PAT; falls back to GITHUB_TOKEN env var
    timeout: 1200

  google_dorks:
    # Google dorking via the Tavily search API.
    # API key is read from the TAVILY_API_KEY environment variable (never hardcoded).
    enabled: true
    search_depth: advanced  # Tavily search depth: "basic" or "advanced"
    max_results: 10         # results returned per dork query
    download: true          # download the discovered result files
    workers: 8              # concurrent downloads
    timeout: 30             # per-download timeout (seconds)

# Optional pre-step: IP -> FQDN resolution (enabled with --ip-list / -i)
ip_resolve:
  workers: 20             # concurrent reverse-DNS lookups
  timeout: 5              # per-lookup DNS timeout (seconds)
  feed_subdomains: true   # fold FCrDNS-validated FQDNs into the subdomain pool
  max_cidr_hosts: 4096    # safety cap when expanding a CIDR range

# Global settings
global:
  max_concurrency: 4      # max parallel tool runs
  output_base: "output"   # base directory for all run outputs
  progress_interval: 30   # seconds between "tools still running" heartbeats (0 to disable)
