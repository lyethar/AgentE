# AgentE — containerized runner.
#
#   cp .env.example .env      # fill in API keys (optional per stage)
#   docker compose run --rm scan -d example.com -c "Acme Corp"
#   # then browse screenshots at http://localhost:7171
#
# Use `run` (foreground, one-shot) rather than `up` — a scan is a foreground job.
# `--rm` cleans up the container on exit; host ./output keeps the results.

services:
  scan:
    build:
      context: .
      dockerfile: Dockerfile
    # Pull the published image instead of building by setting:
    #   docker compose pull   (uses the image tag below)
    image: ghcr.io/lyethar/agente:latest
    # API keys (LEAKIX_API_KEY, GITHUB_TOKEN, INTELX_KEY, TAVILY_API_KEY).
    # Compose ignores this cleanly if .env is absent for stages that don't need keys.
    env_file:
      - .env
    ports:
      - "7171:7171"                       # gowitness report server (Stage 3)
    volumes:
      - ./output:/app/output              # reports + per-stage output persist on the host
      - ./config.yaml:/app/config.yaml:ro # tweak config without rebuilding
      - ./wordlists:/opt/wordlists:ro     # resolvers.txt etc. (puredns / config.yaml)
    # Interactive helper for Stage 8 (LinkedIn login needs a TTY):
    #   docker compose run --rm -it scan -d example.com -c "Acme Corp" --stages 8
    stdin_open: false
    tty: false
    # Uncomment if your resolver / VPN setup needs the host network. Note: with
    # network_mode host the `ports` mapping is ignored and 7171 binds directly.
    # network_mode: host
